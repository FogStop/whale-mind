# whale-mind 的 bundle 补丁层：把本插件作为一行插进 profile 的条目列表。
#
# name 必须是【裸包名】whale-mind（等于 package.json 的 name）。
# config 是整体替换不深合并——只写你想改的键，留空即用默认值。

- insert:
    - id: whale-mind
      name: whale-mind
      config:
        # 档案目录。留空 = ~/.dsh/whale-mind
        dataDir: ''
        # 总开关
        enabled: true
        # 注入预算（token）
        budgetTokens: 3000
